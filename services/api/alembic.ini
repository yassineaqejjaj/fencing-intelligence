[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url = postgresql+psycopg://fencing:fencing@localhost:5432/fencing

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
